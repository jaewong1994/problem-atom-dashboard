<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>기출 원자화 현황판</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="grouped.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">기출문제 분석 · 재조합 시스템</p>
      <h1>세미나 자산 현황판</h1>
      <a class="vision-link" href="vision.html">프로젝트 비전 · 원자 조합 데모 →</a>
    </div>
    <div class="sync-box" aria-live="polite">
      <span id="syncDot" class="sync-dot"></span>
      <div><strong id="syncLabel">연결 확인 중</strong><small id="syncDetail">로컬 JSON을 읽고 있습니다</small></div>
    </div>
  </header>

  <main>
    <nav class="source-tabs" aria-label="시험 유형">
      <button class="source-tab active" type="button" data-group="kice"><strong>평가원</strong><span data-tab-count="kice">0</span><small>6·9월 모의평가 · 수능</small></button>
      <button class="source-tab" type="button" data-group="education"><strong>교육청 학력평가</strong><span data-tab-count="education">0</span><small>추후 적재</small></button>
    </nav>

    <section class="control-panel" aria-label="현황판 필터">
      <div class="member-field">
        <label for="actor">현재 발표자</label>
        <input id="actor" maxlength="20" placeholder="발표자 이름 또는 별칭" autocomplete="off">
      </div>
      <div class="search-field">
        <label for="search">문제 찾기</label>
        <input id="search" type="search" placeholder="연도, 6월, 수능, 미적분, 문항 번호">
      </div>
      <div class="filter-group" aria-label="배점 필터">
        <button class="filter active" data-score="all" type="button">전체</button>
        <button class="filter" data-score="4" type="button">4점</button>
        <button class="filter" data-score="3" type="button">3점</button>
        <button class="filter" data-score="unknown" type="button">미분류</button>
      </div>
      <div class="static-actions" id="staticActions" hidden>
        <button id="exportProgress" type="button">세미나 기록 JSON 내보내기</button>
        <button id="clearDraft" type="button">내 임시 기록 초기화</button>
      </div>
    </section>

    <section class="stats" aria-label="전체 진행률">
      <article class="stat-card primary"><span>4점 분석 완료</span><strong id="fourStat">0 / 0</strong><div class="meter"><i id="fourBar"></i></div></article>
      <article class="stat-card"><span>발표 완료 문항</span><strong id="allStat">0 / 0</strong><small>한 명 이상 발표한 고유 문항</small></article>
      <article class="stat-card"><span>문제 본문 / 이미지</span><strong id="previewStat">0문항</strong><small id="assetStatDetail">연결된 확인 자료</small></article>
      <article class="stat-card"><span>분석 대상 연도</span><strong id="yearStat">0개년</strong><small id="yearStatDetail">선택한 시험 유형</small></article>
    </section>

    <section class="notice" id="notice" hidden></section>
    <section id="examList" class="exam-list" aria-label="기출 체크리스트"></section>
    <div id="empty" class="empty" hidden><strong id="emptyTitle">조건에 맞는 문항이 없습니다.</strong><span id="emptyDetail">검색어나 배점 필터를 바꿔 보세요.</span></div>
  </main>

  <dialog id="previewDialog">
    <button id="closePreview" class="close" type="button" aria-label="미리보기 닫기">×</button>
    <div id="previewTitle" class="preview-title"></div>
    <img id="previewImage" alt="">
  </dialog>

  <template id="examTemplate">
    <details class="exam-card">
      <summary>
        <div class="exam-heading"><span class="year"></span><div><strong class="title"></strong><small class="asset-label"></small></div></div>
        <div class="summary-progress"><span class="count"></span><div class="mini-meter"><i></i></div><b class="percent"></b></div>
      </summary>
      <div class="exam-body">
        <div class="exam-toolbar"><span class="score-breakdown"></span><button class="expand-previews" type="button">미리보기 모두 보기</button></div>
        <div class="question-grid"></div>
      </div>
    </details>
  </template>

  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/auto-render.min.js" defer></script>
  <script src="vendor/ngd2/ngd2-math.js?v=20260824k" defer></script>
  <script src="vendor/ngd2/ngd2-display.js?v=20260825" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
