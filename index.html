<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="기출문제 분석·재조합 시스템의 현황판과 프로젝트 비전으로 이동합니다.">
  <meta name="theme-color" content="#0d7469">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Problem Atom">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Problem Atom · 프로젝트 입장</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
  <link rel="icon" sizes="192x192" href="assets/pwa/icon-192.png">
  <link rel="stylesheet" href="entry.css">
  <link rel="stylesheet" href="pwa-install.css">
</head>
<body>
  <div class="entry-shell">
    <header class="entry-header">
      <a class="entry-brand" href="index.html" aria-label="Problem Atom 입장 화면">
        <span class="brand-mark">PA</span>
        <span>Problem Atom</span>
      </a>
      <p>기출문제 분석 · 재조합 시스템</p>
    </header>

    <main class="entry-main">
      <section class="entry-intro" aria-labelledby="entry-title">
        <p class="entry-kicker">SEMINAR ARCHIVE</p>
        <h1 id="entry-title" data-split-text>문제를 해체하고,<br>다시 설계합니다.</h1>
        <p class="entry-summary">세미나의 진행 상황을 확인하거나, 원자화 연구의 목적과 장기 비전을 살펴보세요.</p>
        <div class="atom-field" aria-hidden="true">
          <span class="atom-core">원자</span>
          <span class="atom-orbit orbit-one"></span>
          <span class="atom-orbit orbit-two"></span>
          <span class="atom-label label-analysis">분석</span>
          <span class="atom-label label-composition">재조합</span>
        </div>
      </section>

      <nav class="entry-routes" aria-label="프로젝트 화면 선택">
        <a class="route route-dashboard" href="dashboard.html">
          <span class="route-index">01</span>
          <span class="route-copy">
            <strong>현황판</strong>
            <small>연도별 기출과 4점 문항 분석 현황, 발표자를 확인합니다.</small>
          </span>
          <span class="route-action">현황 확인</span>
        </a>
        <a class="route route-vision" href="vision.html">
          <span class="route-index">02</span>
          <span class="route-copy">
            <strong>프로젝트 비전</strong>
            <small>원자화의 목적, 검증 기준과 문제 재조합 데모를 살펴봅니다.</small>
          </span>
          <span class="route-action">비전 탐색</span>
        </a>
      </nav>
    </main>

    <footer class="entry-footer">
      <span>수학 문항 연구를 재사용 가능한 자산으로</span>
      <span>SEMINAR · ARCHIVE · RECOMBINATION</span>
    </footer>
  </div>
  <script src="entry.js" defer></script>
  <script src="pwa-install.js" defer></script>
</body>
</html>
