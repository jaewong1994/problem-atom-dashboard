<!--/SITE_NAV--><main id="main" style="max-width:760px;padding-top:64px"><p class="eyebrow">이전 제작실 종료</p><h1>이전 문항 보관함</h1><p>이전 문항 생성 기능은 폐기했습니다. 기존 자산과 새 자료는 통합 목록에서 이어서 확인할 수 있습니다.</p><p style="margin:24px 0"><a href="connections.html">문항 만들기 →</a></p><section><h2>이 브라우저에 보관했던 문항</h2><p id="savedStatus">보관 기록을 확인합니다.</p><button id="exportOld" disabled>이전 보관함 파일 저장</button><p class="muted">기록을 지우지 않습니다. 이 파일은 이전 판본의 결과이며 새 연결 규칙으로 검산된 문항이 아닙니다.</p></section></main><script>
(()=>{let data=[];try{const raw=JSON.parse(localStorage.getItem('pa-studio-saved-v2')||'[]');if(Array.isArray(raw))data=raw;}catch(_){}document.getElementById('savedStatus').textContent=data.length+'개가 남아 있습니다.';const b=document.getElementById('exportOld');b.disabled=!data.length;b.onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({schema:'retired-studio-export/1',items:data},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='이전_제작실_보관함.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};})();</script></body></html>
